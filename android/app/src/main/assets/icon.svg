<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <!-- 타일 그림자 -->
    <filter id="tileShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <!-- 타일 그라데이션 -->
    <linearGradient id="tileGradWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="tileGradYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
  </defs>

  <!-- 메인 배경 (둥근 모서리) -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- 내부 부드러운 테두리 -->
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#60A5FA" stroke-width="4" stroke-opacity="0.4" />

  <!-- 상단 장식 별 & 제목 띠 -->
  <g transform="translate(0, 16)">
    <circle cx="256" cy="48" r="6" fill="#FDE047" />
    <circle cx="228" cy="48" r="4" fill="#93C5FD" />
    <circle cx="284" cy="48" r="4" fill="#93C5FD" />
  </g>

  <!-- 2x2 퍼즐 타일 그룹 (가운데 정렬) -->
  <g transform="translate(76, 76)">
    <!-- 1행 1열: '청' 타일 (흰색) -->
    <g filter="url(#tileShadow)">
      <rect x="0" y="0" width="168" height="168" rx="28" fill="url(#tileGradWhite)" stroke="#E2E8F0" stroke-width="3" />
      <!-- 격자 번호 배지 -->
      <text x="18" y="32" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#2563EB">1</text>
      <!-- 글자 -->
      <text x="84" y="116" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="82" font-weight="900" fill="#1E293B" text-anchor="middle">청</text>
    </g>

    <!-- 1행 2열: '춘' 타일 (노란색 강조) -->
    <g filter="url(#tileShadow)">
      <rect x="192" y="0" width="168" height="168" rx="28" fill="url(#tileGradYellow)" stroke="#FACC15" stroke-width="3" />
      <text x="210" y="32" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#B45309">2</text>
      <text x="276" y="116" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="82" font-weight="900" fill="#854D0E" text-anchor="middle">춘</text>
    </g>

    <!-- 2행 1열: '낱' 타일 (흰색) -->
    <g filter="url(#tileShadow)">
      <rect x="0" y="192" width="168" height="168" rx="28" fill="url(#tileGradWhite)" stroke="#E2E8F0" stroke-width="3" />
      <text x="18" y="224" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#2563EB">3</text>
      <text x="84" y="308" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="82" font-weight="900" fill="#1E293B" text-anchor="middle">낱</text>
    </g>

    <!-- 2행 2열: '말' 타일 (초록빛 정답 강조) -->
    <g filter="url(#tileShadow)">
      <rect x="192" y="192" width="168" height="168" rx="28" fill="#DCFCE7" stroke="#86EFAC" stroke-width="3" />
      <text x="210" y="224" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#15803D">4</text>
      <text x="276" y="308" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="82" font-weight="900" fill="#166534" text-anchor="middle">말</text>
    </g>
  </g>

  <!-- 하단 뱃지: 10x10 100단계 -->
  <g transform="translate(146, 436)" filter="url(#tileShadow)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#FEF08A" stroke="#FDE047" stroke-width="2" />
    <text x="110" y="27" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="900" fill="#1E3A8A" text-anchor="middle" letter-spacing="0.5">10×10 100단계</text>
  </g>
</svg>
